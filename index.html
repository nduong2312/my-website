<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="Chatbot AI chạy trên Cloudflare Workers AI" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">✦</span>
        <span class="brand-name">AI Chatbot</span>
      </div>
      <div class="topbar-actions">
        <button id="new-chat" class="icon-btn" title="Cuộc trò chuyện mới" aria-label="Cuộc trò chuyện mới">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="theme-toggle" class="icon-btn" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">✦</div>
        <h1>Xin chào! Tôi có thể giúp gì cho bạn?</h1>
        <p>Hỏi tôi bất cứ điều gì — từ viết nội dung, giải thích khái niệm, đến gợi ý ý tưởng.</p>
        <div class="suggestions">
          <button class="suggestion">Giải thích lỗ đen cho trẻ 10 tuổi</button>
          <button class="suggestion">Viết email xin nghỉ phép lịch sự</button>
          <button class="suggestion">Gợi ý 5 tên cho quán cà phê</button>
          <button class="suggestion">Lập kế hoạch học tiếng Anh 30 ngày</button>
        </div>
      </div>
    </main>

    <footer class="composer">
      <form id="chat-form" class="composer-inner">
        <textarea
          id="input"
          class="input"
          rows="1"
          placeholder="Nhập tin nhắn của bạn..."
          autocomplete="off"
        ></textarea>
        <button id="send" type="submit" class="send-btn" aria-label="Gửi" title="Gửi">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
      <p class="disclaimer">AI có thể mắc lỗi. Hãy kiểm chứng thông tin quan trọng.</p>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
